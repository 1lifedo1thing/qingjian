[package]
name = "qingjian-settings"
description = "三平台共用的设置程序：画在 render-engine 上，读写同一份 config.toml；成形后替掉 macOS 偏好设置与 Windows 设置"
version = "0.2.1-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# 旧的 Windows 设置程序占了 qingjian-settings 这个名字，替掉它之前先叫这个
[[bin]]
name = "qingjian-settings-ui"
path = "src/main.rs"

[dependencies]
render-engine = { workspace = true, features = ["host"] }
qingjian-render.workspace = true
qingjian-platform.workspace = true
# 模式键的候选字母、辅码触发键的校验
qingjian-core.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# 列本机装的字族（字体下拉框）
cosmic-text.workspace = true
jiff.workspace = true
# 云服务页：测试连接；macOS 上密钥可能在配置同目录的 .env 里，读进来才知道「已设置」
qingjian-predict.workspace = true
qingjian-update.workspace = true
dotenvy.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
